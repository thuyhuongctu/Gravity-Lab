<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gravity Lab">
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1d2a24"/>
      <stop offset="1" stop-color="#0c1210"/>
    </radialGradient>
    <radialGradient id="sun" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#f6d998"/>
      <stop offset="0.55" stop-color="#d79b3a"/>
      <stop offset="1" stop-color="#9c6418"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e7c27a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e7c27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9cfbf"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd4c0" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#8fd4c0"/>
      <stop offset="1" stop-color="#8fd4c0" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <g fill="#f3ece1">
    <circle cx="112" cy="122" r="2.6" opacity="0.55"/>
    <circle cx="396" cy="98" r="2" opacity="0.45"/>
    <circle cx="420" cy="388" r="2.6" opacity="0.4"/>
    <circle cx="96" cy="372" r="1.8" opacity="0.4"/>
    <circle cx="300" cy="420" r="1.6" opacity="0.35"/>
  </g>
  <g transform="rotate(-22 256 256)">
    <ellipse cx="256" cy="256" rx="204" ry="80" fill="none" stroke="#f3ece1" stroke-opacity="0.16" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <!-- back half of the orbit, drawn before the sun -->
    <path d="M 96 256 A 160 61 0 0 1 416 256" fill="none" stroke="url(#orbit)" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
  </g>
  <circle cx="256" cy="256" r="140" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="78" fill="url(#sun)"/>
  <!-- meridians: the sun doubles as a globe -->
  <g fill="none" stroke="#7a4c10" stroke-opacity="0.35" stroke-width="3.5">
    <ellipse cx="256" cy="256" rx="31" ry="78"/>
    <path d="M 181 237 Q 256 223 331 237"/>
    <path d="M 183 283 Q 256 297 329 283"/>
  </g>
  <g transform="rotate(-22 256 256)">
    <!-- front half of the orbit, drawn over the sun -->
    <path d="M 416 256 A 160 61 0 0 1 96 256" fill="none" stroke="url(#orbit)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="394" cy="286" r="26" fill="url(#moon)"/>
  </g>
</svg>
